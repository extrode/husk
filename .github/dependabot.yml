version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned together on purpose: V8, its natives and the Svelte compiler move by hand.
      - dependency-name: Microsoft.ClearScript.*
      # Pare moves by hand with a Husk release (0.7.0 fails every CI job); the MSBuild assemblies match the SDK host.
      - dependency-name: Extrode.Pare*
      - dependency-name: Microsoft.Build.*
