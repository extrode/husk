# Publishes Extrode.Husk.Build and Extrode.Husk.AspNetCore to nuget.org and to GitHub Packages
# (the repository's Packages tab lists only the latter), and attaches them to a GitHub Release. Triggered by version tags only:
#
#   git tag v0.1.0-preview.1 && git push origin v0.1.0-preview.1
#
# The tag must match <Version> in Directory.Build.props; the guard step fails the run otherwise.
#
# Trusted publishing (OIDC), not a stored key, as in jauntyq (decision 008). The nuget.org policy
# names this file, release.yml, and the repository extrode/husk; the variable NUGET_USER is the
# nuget.org profile name. A tag push runs `build` (tests and packs, read-only token, no
# environment), then `release`, which declares the environment `packages`: it waits for the
# required reviewer, then publishes the packed artifact. The other jobs declare it too.
name: release

on:
  push:
    tags: ['v*']
  # Dispatch only proves the token exchange works, so the policy can be checked (and a new
  # policy kept active, nuget.org asks for a first use within 7 days) before a release needs it.
  workflow_dispatch:
    inputs:
      backfill_tag:
        description: 'Existing release tag (e.g. v0.1.0-preview.1) to push to GitHub Packages only; empty runs the OIDC check'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify-trusted-publishing:
    # Not with a backfill tag: that dispatch needs no nuget.org key.
    if: github.event_name == 'workflow_dispatch' && inputs.backfill_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: packages
    permissions:
      contents: read
      id-token: write
    steps:
      - name: NuGet.org login (OIDC, short-lived key)
        id: nuget-login
        # Pinned by digest: this step mints the publishing key. v1 = 8d19675.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Report
        run: |
          if [ -n "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" ]; then
            echo "::notice title=Trusted publishing works::nuget.org issued a short-lived key."
          else
            echo "::error title=No key issued::Check the policy's workflow file name, repository and package pattern."
            exit 1
          fi

  # Dispatch with backfill_tag pushes that release's attached packages to GitHub Packages only,
  # for a tag released before the release job did. Run it from main: a run from a tag uses the
  # workflow file as it was at the tag. Nothing goes to nuget.org.
  backfill-github-packages:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.backfill_tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: packages
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Push the release's packages to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.backfill_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.nupkg' --dir dist/packages
          for pkg in dist/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
              --api-key "$GH_TOKEN" \
              --skip-duplicate
          done

  # Tests and packs with a read-only token and no environment; the publishing job below gets the
  # OIDC and write permissions only after this passes, and waits for the environment's reviewer.
  build:
    # A manual run from a tag ref must not publish: only the tag push does.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Guard - tag matches Directory.Build.props Version
        run: |
          PROP_VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "props=$PROP_VERSION tag=$TAG_VERSION"
          [ "$PROP_VERSION" = "$TAG_VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME != <Version>$PROP_VERSION"; exit 1; }

      - name: Guard - the Pare version Husk pins is on nuget.org
        # A package that depends on a version nobody can restore burns its own version number
        # on nuget.org for good, so stop before the push.
        run: |
          PARE_VERSION=$(sed -n 's/.*<PareVersion>\(.*\)<\/PareVersion>.*/\1/p' Directory.Packages.props | head -1)
          for id in extrode.pare extrode.pare.build extrode.pare.aspnetcore; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/$id/$PARE_VERSION/$id.nuspec")
            [ "$code" = "200" ] || { echo "::error::$id $PARE_VERSION is not on nuget.org ($code); publish Pare first"; exit 1; }
          done

      - name: Test
        run: dotnet test --solution Husk.slnx -c Release

      - name: Pack
        run: |
          for project in Extrode.Husk.Build Extrode.Husk.AspNetCore; do
            dotnet pack "src/$project" -c Release -o dist/packages
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/packages/*.nupkg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: packages
    permissions:
      contents: write   # gh release create
      id-token: write   # NuGet/login
      packages: write   # GitHub Packages push
    steps:
      # gh release create --verify-tag reads the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist/packages

      - name: NuGet.org login (OIDC, short-lived key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        # --skip-duplicate: nuget.org rejects a re-push of a version, so a re-run of a partly
        # failed release would otherwise stop at the first package that already landed.
        run: |
          for pkg in dist/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: GitHub Release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            v0.*|*-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/packages/* --generate-notes --verify-tag $prerelease

      # After the release exists, so a failure here leaves the release for the backfill job to read.
      - name: Push to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pkg in dist/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
              --api-key "$GH_TOKEN" \
              --skip-duplicate
          done
